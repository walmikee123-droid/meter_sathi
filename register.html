<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Meter-Sathi</title>
  <meta name="viewport" content="width=1400">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.css"/>
  <style>
    .name-row { display: flex; gap: 15px; }
    .name-row .form-group { flex: 1; }
    .iti { width: 100%; display: block; }
    .iti__country-list { background-color: var(--card-bg); border: 1px solid var(--glass-border); color: white; }
    .iti__country-list .iti__country:hover { background-color: rgba(255,193,7,0.2); }
  </style>
</head>
<body>
  <div class="auth-wrapper" style="padding-top: 60px; padding-bottom: 60px;">
    <div class="auth-card" style="max-width: 500px;">
      <div style="margin-bottom: 30px;">
        <a href="welcome.html" class="nav-back" style="display:inline-flex; width:auto;">
          <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
      </div>

      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join Meter-Sathi and start saving money.</p>
      </div>

      <form id="registerForm">
        <div class="name-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="First name" required>
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Last name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope" style="margin-right:6px; color:var(--taxi-yellow);"></i>Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock" style="margin-right:6px; color:var(--taxi-yellow);"></i>Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Create a password" required>
            <button type="button" class="toggle-btn" onclick="togglePassword('password', this)"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword"><i class="fa-solid fa-check-double" style="margin-right:6px; color:var(--taxi-yellow);"></i>Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword', this)"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="error-msg" id="passError">Passwords do not match.</div>
        </div>

        <div class="form-group">
          <label for="phone"><i class="fa-solid fa-phone" style="margin-right:6px; color:var(--taxi-yellow);"></i>Phone Number</label>
          <input id="phone" type="tel" placeholder="10-digit number" required maxlength="10">
          <div class="error-msg" id="phoneError">Enter a valid 10-digit number.</div>
        </div>

        <div class="form-group" style="margin-top: 30px; margin-bottom: 20px;">
          <label style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer;">
            <input type="checkbox" id="termsConsent" required style="width: auto; margin-top: 4px; transform: scale(1.2); accent-color: var(--taxi-yellow);">
            <span style="font-size: 14px; font-weight: 500; color: #ccc; line-height: 1.5;">
              By ticking I agree to the Terms and Conditions of this site.<br>
              <span style="font-size: 13px;">To read the Terms and Conditions <a href="terms.html" style="color: var(--taxi-yellow); text-decoration: underline;">click here</a>.</span>
            </span>
          </label>
        </div>

        <button type="submit" class="auth-btn-submit" style="margin-top: 10px;">Register Account</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyArV1sP0G8-6NwRUclY3uChof3b9TfmGB0",
      authDomain: "meter-sathi.firebaseapp.com",
      projectId: "meter-sathi",
      storageBucket: "meter-sathi.firebasestorage.app",
      messagingSenderId: "762038628393",
      appId: "1:762038628393:web:6a03c56a9b945fe36aac38"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    import "https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js";
    const phoneInput = document.querySelector("#phone");
    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "in",
      separateDialCode: true,
      preferredCountries: ["in", "us", "gb"],
      utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/utils.js"
    });

    phoneInput.addEventListener("input", function () {
      this.value = this.value.replace(/[^0-9]/g, "");
    });

    window.togglePassword = function(id, btn) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        input.type = "password";
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
    };

    const form = document.getElementById("registerForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const passError = document.getElementById("passError");
    const phoneError = document.getElementById("phoneError");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      let valid = true;
      if (password.value !== confirmPassword.value) {
        passError.style.display = "block";
        valid = false;
      } else {
        passError.style.display = "none";
      }
      
      if (phoneInput.value.length !== 10) {
        phoneError.style.display = "block";
        valid = false;
      } else {
        phoneError.style.display = "none";
      }

      if (!valid) return;
      
      const email = document.getElementById("email").value;
      const firstName = document.getElementById("firstName").value;
      const lastName = document.getElementById("lastName").value;
      const phoneNumber = iti.getNumber(); 

      const submitBtn = document.querySelector(".auth-btn-submit");
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = "Processing...";
      submitBtn.disabled = true;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password.value);
        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
          firstName: firstName,
          lastName: lastName,
          email: email,
          phone: phoneNumber,
          createdAt: new Date().toISOString()
        });

        window.location.href = "welcome.html";

      } catch (error) {
        console.error("Error signing up:", error);
        alert("Error: " + error.message);
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
