<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Meter-Sathi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#000;
  --gold:#FFD700;
  --gold-strong:#ffcc00;
  --card:#1A1A1A;
  --muted:#dddddd;
  --border:#333;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-container{
  background:var(--card);
  padding:30px;
  border-radius:12px;
  width:320px;
  box-shadow:0 0 20px rgba(255, 215, 0, 0.2);
  border:1px solid var(--border);
}

/* --- Premium Stylish Back Button --- */
.back-btn-container {
  margin-bottom: 20px;
  text-align: left;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 16px 6px 6px; 
  border: 1px solid var(--border);
  border-radius: 30px;
  background: #000; 
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.back-btn .arrow-circle {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #222;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  font-size: 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.back-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
  transform: translateX(-5px);
  box-shadow: 0 4px 12px rgba(255, 215, 0, 0.15);
}

.back-btn:hover .arrow-circle {
  background: var(--gold);
  color: #000;
}
/* --- End Back Button Styles --- */

.login-container h2{
  text-align:center;
  color:var(--gold);
  margin-bottom:20px;
  margin-top:0;
}

.input-box{
  margin-bottom:15px;
}

.input-box label{
  font-size:14px;
  color:var(--muted);
}

.input-box input{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:1px solid var(--border);
  border-radius:6px;
  background:#000;
  color:#fff;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.input-box input:focus{
  border-color:var(--gold);
  box-shadow:0 0 5px rgba(255, 215, 0, 0.5);
}

.password-wrapper{
  position:relative;
}

.password-wrapper input{
  padding-right:60px;
}

.toggle-password{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--gold);
  font-size:13px;
  cursor:pointer;
  font-weight:bold;
}

/* ✅ Updated text color */
.extra-links{
  margin-top:15px;
  font-size:14px;
  text-align:center;
  color:var(--gold);
}

.extra-links a{
  color:var(--gold);
  text-decoration:none;
  font-weight:bold;
}

.extra-links a:hover{
  text-decoration:underline;
}

.login-btn{
  width:100%;
  padding:12px;
  background:var(--gold);
  border:none;
  color:#000;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  transition: background 0.3s, transform 0.2s;
}

.login-btn:hover{
  background:var(--gold-strong);
  transform: translateY(-2px);
}
</style>
</head>

<body>

<div class="login-container">
  
  <div class="back-btn-container">
    <a href="welcome.html" class="back-btn">
      <span class="arrow-circle">&larr;</span> Back
    </a>
  </div>

  <h2>Login</h2>

  <form id="loginForm">
    
    <div class="input-box">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" required>
    </div>

    <div class="input-box">
      <label for="password">Password</label>

      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter password" required>
        <button type="button" class="toggle-password" onclick="togglePassword(this)">Show</button>
      </div>
    </div>

    <button type="submit" class="login-btn">Login</button>
  </form>

  <div class="extra-links">
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

<script>
// Toggle password (fixed)
function togglePassword(btn) {
  const input = document.getElementById("password");

  if (input.type === "password") {
    input.type = "text";
    btn.innerText = "Hide";
  } else {
    input.type = "password";
    btn.innerText = "Show";
  }
}
</script>

</body>
</html>
