<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Meter-Sathi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- intl-tel-input CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.css"/>

<style>
:root{
  --bg:#000;
  --gold:#FFD700;
  --gold-strong:#ffcc00;
  --card:#1A1A1A;
  --muted:#dddddd;
  --font:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --border:#333;
  --active-item-color:#FFC400;
  --body-text-white:#FFFFFF;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:var(--font);
}

body{
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
}

.register-container{
  background:var(--card);
  padding:30px;
  border-radius:12px;
  width:340px;
  box-shadow:0 0 20px rgba(255,215,0,0.2);
  border:1px solid var(--border);
}

.register-container h2{
  text-align:center;
  color:var(--gold);
  margin-bottom:20px;
}

.input-box{
  margin-bottom:15px;
}

.input-box label{
  font-size:14px;
  color:var(--muted);
}

/* Inputs */
.input-box input{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:1px solid var(--border);
  border-radius:6px;
  background:#000;
  color:#fff;
}

.input-box input:focus{
  border-color:var(--gold);
  box-shadow:0 0 5px var(--gold);
  outline:none;
}

/* Password toggle */
.password-box{
  position:relative;
}

.toggle-password{
  position:absolute;
  right:10px;
  top:38px;
  cursor:pointer;
  color:var(--gold);
  font-size:14px;
}

/* ===== PHONE INPUT FIX ===== */
.iti{
  width:100%;
}

.iti input{
  width:100%;
  padding-left:95px !important; /* space for flag + code */
  background:#000;
  color:#fff;
  border:1px solid var(--border);
  border-radius:6px;
}

/* Flag area */
.iti__flag-container{
  background:#000;
  border-right:1px solid var(--border);
}

/* Button */
.register-btn{
  width:100%;
  padding:10px;
  background:var(--gold);
  border:none;
  color:#000;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.register-btn:hover{
  background:var(--gold-strong);
}

/* Links */
.extra-links{
  margin-top:15px;
  text-align:center;
}

.extra-links p{
  color:#fff;
}

.extra-links a{
  color:var(--gold);
  text-decoration:none;
}

.extra-links a:hover{
  color:var(--active-item-color);
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="register-container">
  <h2>Register</h2>

  <form>
    <div class="input-box">
      <label>Full Name</label>
      <input type="text" required>
    </div>

    <div class="input-box">
      <label>Email</label>
      <input type="email" required>
    </div>

    <div class="input-box password-box">
      <label>Password</label>
      <input type="password" id="password" required>
      <span class="toggle-password" onclick="togglePassword()">Show</span>
    </div>

    <div class="input-box">
      <label>Phone Number</label>
      <input id="phone" type="tel" required>
    </div>

    <button class="register-btn">Register</button>
  </form>

  <div class="extra-links">
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<!-- intl-tel-input JS -->
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/utils.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  // PASTE YOUR CONFIG HERE:
  const firebaseConfig = {
  apiKey: "AIzaSyArV1sP0G8-6NwRUclY3uChof3b9TfmGB0",
  authDomain: "meter-sathi.firebaseapp.com",
  projectId: "meter-sathi",
  storageBucket: "meter-sathi.firebasestorage.app",
  messagingSenderId: "762038628393",
  appId: "1:762038628393:web:6a03c56a9b945fe36aac38"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.querySelector("form").addEventListener("submit", (e) => {
    e.preventDefault(); 
    const email = document.querySelector("input[type='email']").value;
    const password = document.getElementById("password").value;

    createUserWithEmailAndPassword(auth, email, password)
      .then(() => {
        alert("Registration Successful!");
        window.location.href = "login.html"; 
      })
      .catch((error) => {
        alert("Error: " + error.message);
      });
  });
</script>

</body>
</html>
