<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meter-Sathi Ride Auditor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #E1F5FE; color: #333; }
    .navbar { display: flex; justify-content: center; background-color: #1565C0; padding: 12px 0; }
    .nav-links { display: flex; justify-content: center; gap: 15px; }
    .nav-links a { padding: 8px 14px; border-radius: 5px; text-decoration: none; color: #fff; font-weight: bold; transition: background-color 0.3s ease; }
    .nav-links a:hover { background-color: #00E5FF; }
    .container { text-align: center; padding: 40px; }
    .brand-title { font-size: 48px; font-weight: bold; color: #1565C0; margin-bottom: 10px; }
    .brand-subtitle { font-size: 22px; color: #555; margin-bottom: 30px; }
    button { margin: 10px; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; color: #fff; font-weight: bold; }
    button.start { background-color: #43A047; }
    button.end { background-color: #E53935; }
    button.check { background-color: #1E88E5; }
    input { padding: 10px; margin: 10px; border: 1px solid #ccc; border-radius: 5px; width: 200px; }
    .results { margin-top: 20px; font-weight: bold; }
    .message { margin-top: 15px; font-size: 18px; color: #1565C0; height: 24px; }
    footer { background-color: #263238; color: #fff; text-align: center; padding: 15px; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </div>

  <div class="container">
    <div class="brand-title">Meter-Sathi</div>
    <div class="brand-subtitle">Auto/Taxi Fare Auditor</div>

    <button class="start" onclick="startRide()">Start Ride</button>
    <button class="end" onclick="endRide()">End Ride</button>
    <button class="check" id="checkBtn" onclick="compareFare()">Check Fare</button>

    <p id="distance">Distance: 0 km</p>

    <label for="meter">Meter Reading (₹):</label>
    <input type="text" id="meter" placeholder="Enter meter fare">

    <div class="results">
      <p id="official">Official Fare: ₹0</p>
      <p id="meterFare">Meter Fare: ₹0</p>
      <p id="difference">Difference: ₹0</p>
      <p id="dayDist">Day Distance: 0 km</p>
      <p id="nightDist">Night Distance: 0 km</p>
    </div>

    <p class="message" id="message"></p>
    <p style="color:#0277BD; font-weight:bold;">Based on MMRTA Official Tariff 2025</p>
  </div>

  <footer><p>© 2024 Meter-Sathi</p></footer>

  <script>
    let watchId;
    let startCoords = null;
    let totalDistance = 0;
    let rideStarted = false;
    let rideEnded = false;
    let dayDistance = 0;
    let nightDistance = 0;

    function startRide() {
      resetApp(); 
      rideStarted = true;
      rideEnded = false;
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          startCoords = pos.coords;
        });
        watchId = navigator.geolocation.watchPosition(trackRide, null, { enableHighAccuracy: true });
        // ALERT REMOVED! Tracking starts silently now.
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    }

    function trackRide(position) {
      if (startCoords) {
        const lat1 = startCoords.latitude;
        const lon1 = startCoords.longitude;
        const lat2 = position.coords.latitude;
        const lon2 = position.coords.longitude;
        const dist = getDistance(lat1, lon1, lat2, lon2);

        const hour = new Date().getHours();
        if (hour >= 0 && hour < 5) {
          nightDistance += dist;
        } else {
          dayDistance += dist;
        }

        totalDistance = dayDistance + nightDistance;
        startCoords = position.coords;
        document.getElementById("distance").innerText = "Distance: " + totalDistance.toFixed(2) + " km";
        document.getElementById("dayDist").innerText = "Day Distance: " + dayDistance.toFixed(2) + " km";
        document.getElementById("nightDist").innerText = "Night Distance: " + nightDistance.toFixed(2) + " km";
      }
    }

    function endRide() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
      }
      rideEnded = true;
      if (totalDistance === 0) {
        alert("Minimum payable fare is ₹26 if distance is between 0 to 1.49 km.");
      } else {
        alert("Ride ended. Total Distance: " + totalDistance.toFixed(2) + " km");
      }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function calculateOfficialFare() {
      let fare = 26; 
      if (dayDistance > 0) {
        fare += dayDistance * 17.14;
      }
      if (nightDistance > 0) {
        fare += nightDistance * 17.14 * 1.25; 
      }
      return Math.round(fare);
    }

    function compareFare() {
      if (!rideStarted || !rideEnded) {
        alert("To access this you have to start and end the ride first.");
        resetApp(); 
        return;
      }

      const meterInput = document.getElementById("meter").value;
      const officialFare = calculateOfficialFare();
      const meterValue = parseFloat(meterInput) || 0;
      const difference = meterValue - officialFare;

      document.getElementById("official").innerText = "Official Fare: ₹" + officialFare;
      document.getElementById("meterFare").innerText = "Meter Fare: ₹" + meterValue;
      document.getElementById("difference").innerText = "Difference: ₹" + difference.toFixed(2);

      if (difference > 0) {
        document.getElementById("message").innerText = "You are being overcharged by ₹" + difference.toFixed(2);
      } else if (difference < 0) {
        document.getElementById("message").innerText = "Meter shows less than official fare.";
      } else {
        document.getElementById("message").innerText = "Fair Fare!";
      }
    }

    function resetApp() {
      totalDistance = 0;
      dayDistance = 0;
      nightDistance = 0;
      rideStarted = false;
      rideEnded = false;
      startCoords = null;
      
      document.getElementById("distance").innerText = "Distance: 0 km";
      document.getElementById("dayDist").innerText = "Day Distance: 0 km";
      document.getElementById("nightDist").innerText = "Night Distance: 0 km";
      document.getElementById("official").innerText = "Official Fare: ₹0";
      document.getElementById("meterFare").innerText = "Meter Fare: ₹0";
      document.getElementById("difference").innerText = "Difference: ₹0";
      document.getElementById("message").innerText = "";
      document.getElementById("meter").value = "";
    }

    document.getElementById("meter").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        compareFare();
      }
    });

    document.getElementById("meter").addEventListener("keypress", function(event) {
      if (!/[0-9]/.test(event.key)) {
        event.preventDefault();
      }
    });
  </script>
</body>
</html>
