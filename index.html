<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meter-Sathi Ride Auditor</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #000000, #1c1c1c);
      color: #ffffff;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: center;
      background-color: #000000;
      padding: 15px 0;
      border-bottom: 4px solid #ffcc00;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      padding: 8px 15px;
      border-radius: 20px;
      text-decoration: none;
      color: #ffcc00;
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-links a:hover {
      background-color: #ffcc00;
      color: #000000;
    }

    /* Main Container */
    .container {
      text-align: center;
      padding: 50px 20px;
    }

    .brand-title {
      font-size: 48px;
      font-weight: bold;
      color: #ffcc00;
      margin-bottom: 10px;
    }

    .brand-subtitle {
      font-size: 22px;
      color: #dddddd;
      margin-bottom: 30px;
    }

    /* Buttons */
    button {
      margin: 10px;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    button.start {
      background-color: #43A047;
      color: white;
    }

    button.end {
      background-color: #E53935;
      color: white;
    }

    button.check {
      background-color: #ffcc00;
      color: #000000;
    }

    button:hover {
      transform: scale(1.05);
    }

    input {
      padding: 10px;
      margin: 10px;
      border-radius: 20px;
      border: 2px solid #ffcc00;
      width: 220px;
      background: #111111;
      color: #ffffff;
      text-align: center;
    }

    input::placeholder {
      color: #bbbbbb;
    }

    .results {
      margin-top: 20px;
      font-weight: bold;
      color: #ffcc00;
    }

    .message {
      margin-top: 15px;
      font-size: 18px;
      color: #ffffff;
      height: 24px;
    }

    footer {
      background-color: #000000;
      color: #ffcc00;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      border-top: 4px solid #ffcc00;
    }

    @media (max-width: 768px) {
      .brand-title {
        font-size: 36px;
      }
    }

  </style>
</head>

<body>

  <div class="navbar">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </div>

  <div class="container">
    <div class="brand-title">🚕 Meter-Sathi</div>
    <div class="brand-subtitle">Auto / Taxi Fare Auditor</div>

    <button class="start" onclick="startRide()">Start Ride</button>
    <button class="end" onclick="endRide()">End Ride</button>
    <button class="check" onclick="compareFare()">Check Fare</button>

    <p id="distance">Distance: 0.00 km</p>

    <label for="meter">Meter Reading (₹):</label><br>
    <input type="text" id="meter" placeholder="Enter meter fare">

    <div class="results">
      <p id="official">Official Fare: ₹0.00</p>
      <p id="meterFare">Meter Fare: ₹0.00</p>
      <p id="difference">Difference: ₹0.00</p>
      <p id="dayDist">Day Distance: 0.00 km</p>
      <p id="nightDist">Night Distance: 0.00 km</p>
    </div>

    <p class="message" id="message"></p>
    <p style="color:#ffcc00; font-weight:bold;">
      Based on MMRTA Official Tariff 2025
    </p>
  </div>

  <footer>
    <p>© 2024 Meter-Sathi</p>
  </footer>

  <!-- YOUR ORIGINAL JAVASCRIPT REMAINS SAME BELOW -->
  <script>
    /* Keep your entire original JavaScript code here unchanged */
  </script>

</body>
</html>
