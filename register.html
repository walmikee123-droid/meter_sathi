<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Meter-Sathi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.css"/>

<style>
:root{
  --bg:#000;
  --gold:#FFD700;
  --card:#1A1A1A;
  --muted:#ddd;
  --border:#333;
  --error:#ff4d4d;
}

body{
  background:var(--bg);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Segoe UI',sans-serif;
}

.register-container{
  background:var(--card);
  padding:30px;
  border-radius:12px;
  width:340px;
}

h2{text-align:center;color:var(--gold);}

.input-box{margin-bottom:15px;}
.input-box label{color:var(--muted);font-size:14px;}

.input-box input{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#000;
  border:1px solid var(--border);
  color:#fff;
}

.name-row{display:flex;gap:10px;}
.name-row .input-box{flex:1;}

.password-box{position:relative;}

.toggle-password{
  position:absolute;
  right:10px;
  top:38px;
  background:none;
  border:none;
  color:var(--gold);
  cursor:pointer;
}

.error{
  color:var(--error);
  font-size:12px;
  margin-top:5px;
  display:none;
}

.register-btn{
  width:100%;
  padding:10px;
  background:var(--gold);
  border:none;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="register-container">
  <h2>Register</h2>

  <form id="registerForm">

    <div class="name-row">
      <div class="input-box">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="Enter first name" required>
      </div>
      <div class="input-box">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Enter last name" required>
      </div>
    </div>

    <div class="input-box">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" required>
    </div>

    <div class="input-box password-box">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
      <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Show</button>
    </div>

    <div class="input-box password-box">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm password" required>
      <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">Show</button>
      <div class="error" id="passError">Passwords do not match</div>
    </div>

    <div class="input-box">
      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" placeholder="Enter 10-digit number" required maxlength="10">
    </div>

    <button type="submit" class="register-btn">Register</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>

<script>
// Initialize phone input
const phoneInput = document.querySelector("#phone");

window.intlTelInput(phoneInput, {
  initialCountry: "in",
  separateDialCode: true,
  preferredCountries: ["in", "us", "gb"]
});

// Allow only numbers
phoneInput.addEventListener("input", function () {
  this.value = this.value.replace(/[^0-9]/g, "");
});

// Toggle password
function togglePassword() {
  const pass = document.getElementById("password");
  const toggle = document.querySelector(".toggle-password");

  if (pass.type === "password") {
    pass.type = "text";
    toggle.innerText = "Hide";
  } else {
    pass.type = "password";
    toggle.innerText = "Show";
  }
}
</script>

</body>
</html>
