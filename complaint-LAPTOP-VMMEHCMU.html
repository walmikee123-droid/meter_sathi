<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File a complaint - Meter-Sathi</title>
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* ------------------------------------------------------------
           Design System (Black & Gold #ffcc00)
           ------------------------------------------------------------
           The variables below define the core visual identity of Meter-Sathi.
           Using variables makes it easy to update the theme globally.
        */
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --gold-primary: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.15);
            --text-white: #ffffff;
            --text-dim: #aaaaaa;
            --border-std: #333333;
            --success-color: #4CAF50;
            --input-bg: #1a1a1a;
        }

        /* ------------------------------------------------------------
           Global Reset & Layout
           ------------------------------------------------------------
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-color), #1c1c1c);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* Scroll enable rakha hai taaki native pickers ko jagah mile */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ------------------------------------------------------------
           Main Wrapper (Container)
           ------------------------------------------------------------
        */
        .container {
            flex: 1;
            /* Extra bottom padding taaki mobile picker niche na kape */
            padding: 30px 15px 100px 15px; 
            display: flex;
            justify-content: center;
            /* Flex-start ensures card stays at top, leaving space below for UI popups */
            align-items: flex-start; 
        }

        /* ------------------------------------------------------------
           Complaint Card Styling
           ------------------------------------------------------------
        */
        .complaint-card {
            background: var(--card-bg);
            max-width: 950px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px var(--gold-glow);
            border: 1px solid var(--border-std);
            border-top: 5px solid var(--gold-primary);
            position: relative;
            /* Ensuring the card doesn't restrict native picker height */
            height: auto;
        }

        /* ------------------------------------------------------------
           Navigation & Back Button
           ------------------------------------------------------------
        */
        .back-btn-container {
            text-align: left;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            color: var(--gold-primary);
            background: rgba(255, 204, 0, 0.1);
            transform: translateX(-5px);
        }

        .back-btn span {
            margin-right: 10px;
            font-size: 20px;
        }

        /* ------------------------------------------------------------
           Headers (Sentence Case)
           ------------------------------------------------------------
        */
        .complaint-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .complaint-header h2 {
            font-size: 36px;
            color: var(--gold-primary);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .complaint-header p {
            font-size: 16px;
            color: var(--text-dim);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ------------------------------------------------------------
           Form Grid Architecture
           ------------------------------------------------------------
        */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            text-align: left;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 10px;
            font-size: 14px;
            color: #dddddd;
            font-weight: 600;
        }
        
        input, select, textarea {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--border-std);
            color: #ffffff !important;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            width: 100%;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
            background-color: #222222 !important;
        }

        /* ------------------------------------------------------------
           Native Time Picker Golden Theme
           ------------------------------------------------------------
        */
        input[type="time"] {
            color-scheme: dark;
            color: var(--gold-primary);
        }

        /* EXACT #FFCC00 FILTER FOR THE CLOCK ICON */
        ::-webkit-calendar-picker-indicator {
            /* Precise calculation for #ffcc00 from black */
            filter: invert(62%) sepia(195%) saturate(1915%) hue-rotate(353deg) brightness(301%) contrast(106%);
            cursor: pointer;
            padding: 5px;
        }

        /* ------------------------------------------------------------
           File Attachment & Buttons
           ------------------------------------------------------------
        */
        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            background-color: var(--input-bg);
            border: 2px dashed var(--gold-primary);
            color: var(--gold-primary);
            padding: 25px;
            text-align: center;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 700;
            display: block;
        }

        .submit-btn {
            display: block;
            padding: 18px 40px;
            background: var(--gold-primary);
            color: #000000;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            transition: all 0.4s ease;
            border: 2px solid var(--gold-primary);
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(255, 204, 0, 0.25);
        }

        .submit-btn:hover {
            background: transparent;
            color: var(--gold-primary);
            transform: translateY(-4px);
        }

        /* ------------------------------------------------------------
           Success Block
           ------------------------------------------------------------
        */
        #successMessage {
            display: none;
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        #successMessage h2 {
            color: var(--success-color);
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ------------------------------------------------------------
           Footer
           ------------------------------------------------------------
        */
        footer {
            background: #000000;
            color: var(--gold-primary);
            text-align: center;
            padding: 35px;
            border-top: 5px solid var(--gold-primary);
            margin-top: auto; 
        }

        footer a {
            color: var(--gold-primary);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
        }

        /* ------------------------------------------------------------
           Mobile Responsiveness
           ------------------------------------------------------------
        */
        @media (max-width: 768px) {
            .container { padding: 15px 10px 120px 10px; }
            .complaint-card { padding: 30px 15px; }
            .complaint-header h2 { font-size: 26px; }
            .form-grid { grid-template-columns: 1fr; gap: 20px; }
            input, select, textarea { font-size: 16px; padding: 14px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="complaint-card">
            
            <div class="back-btn-container">
                <a href="welcome.html" class="back-btn">
                    <span>&larr;</span> Back to home
                </a>
            </div>

            <div id="formSection">
                <div class="complaint-header">
                    <h2>File a complaint</h2>
                    <p>Enter the details of the incident below for verification.</p>
                </div>

                <form id="complaintForm">
                    <div class="form-grid">
                        
                        <div class="input-group">
                            <label for="vehicleType">Vehicle type *</label>
                            <select id="vehicleType" required>
                                <option value="" disabled selected>Select auto or taxi</option>
                                <option value="auto">Auto Rickshaw</option>
                                <option value="ac_taxi">AC Taxi</option>
                                <option value="non_ac_taxi">Non-AC Taxi</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="vehicleNumber">Registration number *</label>
                            <input type="text" id="vehicleNumber" placeholder="MH 01 AA 0001" required maxlength="13">
                        </div>

                        <div class="input-group">
                            <label for="incidentDate">Date of incident *</label>
                            <input type="text" id="incidentDate" placeholder="DD/MM/YYYY" required maxlength="10">
                        </div>

                        <div class="input-group">
                            <label for="incidentTime">Time of incident *</label>
                            <input type="time" id="incidentTime" required step="60">
                        </div>

                        <div class="input-group full-width">
                            <label for="issueType">Primary issue *</label>
                            <select id="issueType" required>
                                <option value="" disabled selected>What went wrong?</option>
                                <option value="tampered_meter">Tampered / Fast meter</option>
                                <option value="refusal_meter">Refusal to charge by meter</option>
                                <option value="incorrect_night">Incorrect night charges</option>
                                <option value="long_route">Taking longer route intentionally</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="pickupLocation">Pickup point *</label>
                            <input type="text" id="pickupLocation" placeholder="Start location" required>
                        </div>

                        <div class="input-group">
                            <label for="dropoffLocation">Drop-off point *</label>
                            <input type="text" id="dropoffLocation" placeholder="End location" required>
                        </div>

                        <div class="input-group">
                            <label for="driverFare">Fare demanded (₹) *</label>
                            <input type="number" id="driverFare" placeholder="0.00" required step="0.01">
                        </div>

                        <div class="input-group">
                            <label for="calculatedFare">Official fare (₹) *</label>
                            <input type="number" id="calculatedFare" placeholder="0.00" required step="0.01">
                        </div>
                        
                        <div class="input-group full-width">
                            <label for="description">Detailed description</label>
                            <textarea id="description" rows="4" placeholder="Briefly describe what happened..."></textarea>
                        </div>

                        <div class="input-group full-width">
                            <label for="evidenceUpload" class="file-upload-btn" id="fileLabel">
                                📸 Attach photo of meter or plate
                            </label>
                            <input type="file" id="evidenceUpload" accept="image/*">
                        </div>

                        <div class="input-group full-width">
                            <button type="submit" class="submit-btn" id="submitBtn">Submit complaint</button>
                        </div>

                    </div>
                </form>
            </div>

            <div id="successMessage">
                <h2>✅ Complaint filed successfully</h2>
                <p>We have received your report and stored it in the database.<br>
                Reference ID: <strong id="refNumber" style="color: #ffcc00;"></strong></p>
                <button class="submit-btn" style="width: auto; padding: 20px 50px; margin-top: 35px;" onclick="location.reload()">File new report</button>
            </div>

        </div>
    </div>
    
    <footer class="site-footer">
    <p>© 2026 Meter-Sathi |
      <a href="privacy.html">Privacy Policy</a>|
      <a href="terms.html">Terms and Conditions</a>
    </p>
  </footer>

    <script type="module">
        /* ------------------------------------------------------------
           STRICT VEHICLE NUMBER FORMATTER (MH 01 AA 0001)
           ------------------------------------------------------------
        */
        const vInput = document.getElementById('vehicleNumber');
        vInput.addEventListener('input', function(e) {
            if (e.inputType === 'deleteContentBackward') return;

            let val = this.value.toUpperCase();
            let res = '';
            let idx = 0; 

            for (let i = 0; i < val.length; i++) {
                let char = val[i];
                if (char === ' ') continue;

                if (idx === 0 || idx === 1) {
                    if (/[A-Z]/.test(char)) res += char;
                } else if (idx === 2 || idx === 3) {
                    if (idx === 2 && res.length === 2) res += ' ';
                    if (/[0-9]/.test(char)) res += char;
                } else if (idx === 4 || idx === 5) {
                    if (idx === 4 && res.length === 5) res += ' ';
                    if (/[A-Z]/.test(char)) res += char;
                } else if (idx >= 6 && idx <= 9) {
                    if (idx === 6 && res.length === 8) res += ' ';
                    if (/[0-9]/.test(char)) res += char;
                }

                if (/[A-Z0-9]/.test(char)) idx++;
                if (idx >= 10) break;
            }
            this.value = res;
        });

        /* ------------------------------------------------------------
           DATE AUTO-CORRECTOR & FUTURE BLOCKER
           ------------------------------------------------------------
        */
        const dInput = document.getElementById('incidentDate');
        dInput.addEventListener('input', function(e) {
            if (e.inputType === 'deleteContentBackward') return;
            
            let v = this.value.replace(/\D/g, ''); 
            const today = new Date();
            const curDD = today.getDate();
            const curMM = today.getMonth() + 1; 
            const curYYYY = today.getFullYear();

            if (v.length >= 2) {
                let dd = parseInt(v.substring(0, 2));
                if (dd === 0) dd = 1; if (dd > 31) dd = 31;
                v = dd.toString().padStart(2, '0') + v.substring(2);
            }
            
            if (v.length >= 4) {
                let mm = parseInt(v.substring(2, 4));
                if (mm === 0) mm = 1; if (mm > 12) mm = 12; 
                let dd = parseInt(v.substring(0, 2));
                let yyyy = curYYYY; 
                
                if (v.length === 8) {
                    yyyy = parseInt(v.substring(4, 8));
                    if (new Date(yyyy, mm - 1, dd) > today) {
                        dd = curDD; mm = curMM; yyyy = curYYYY;
                    }
                }
                let maxDays = new Date(yyyy, mm, 0).getDate(); 
                if (dd > maxDays) dd = maxDays;
                v = dd.toString().padStart(2, '0') + mm.toString().padStart(2, '0') + (v.length > 4 ? (v.length === 8 ? yyyy.toString() : v.substring(4)) : '');
            }
            
            if (v.length >= 5) {
                this.value = v.substring(0, 2) + '/' + v.substring(2, 4) + '/' + v.substring(4, 8);
            } else if (v.length >= 3) {
                this.value = v.substring(0, 2) + '/' + v.substring(2, 4);
            } else {
                this.value = v;
            }
        });

        /* --- MOCK SUBMISSION (Testing Mode) --- */
        const form = document.getElementById('complaintForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('submitBtn').innerText = "Processing report...";
            setTimeout(() => {
                document.getElementById('refNumber').innerText = "MS-" + Math.floor(Math.random()*99999);
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            }, 1200);
        });

        // File Selection UI Update
        document.getElementById('evidenceUpload').addEventListener('change', function() {
            if (this.files[0]) {
                document.getElementById('fileLabel').innerText = "📁 File: " + this.files[0].name;
                document.getElementById('fileLabel').style.color = "#4CAF50";
            }
        });
    </script>
</body>
</html>
