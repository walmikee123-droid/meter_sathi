<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Meter-Sathi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#000;
  --gold:#FFD700;
  --gold-strong:#ffcc00;
  --card:#1A1A1A;
  --muted:#dddddd;
  --border:#333;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-container{
  background:var(--card);
  padding:30px;
  border-radius:12px;
  width:320px;
  box-shadow:0 0 20px rgba(255, 215, 0, 0.2);
  border:1px solid var(--border);
}

.login-container h2{
  text-align:center;
  color:var(--gold);
  margin-bottom:20px;
}

.input-box{
  margin-bottom:15px;
}

.input-box label{
  font-size:14px;
  color:var(--muted);
}

.input-box input{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:1px solid var(--border);
  border-radius:6px;
  background:#000;
  color:#fff;
}

.input-box input:focus{
  border-color:var(--gold);
  box-shadow:0 0 5px var(--gold);
}

.password-wrapper{
  position:relative;
}

.password-wrapper input{
  padding-right:60px;
}

.toggle-password{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--gold);
  font-size:13px;
  cursor:pointer;
  font-weight:bold;
}

/* ✅ Updated text color */
.extra-links{
  margin-top:15px;
  font-size:14px;
  text-align:center;
  color:var(--gold);
}

.extra-links a{
  color:var(--gold);
  text-decoration:none;
  font-weight:bold;
}

.extra-links a:hover{
  text-decoration:underline;
}

.login-btn{
  width:100%;
  padding:10px;
  background:var(--gold);
  border:none;
  color:#000;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.login-btn:hover{
  background:var(--gold-strong);
}
</style>
</head>

<body>

<div class="login-container">
  <h2>Login</h2>

  <form id="loginForm">
    
    <div class="input-box">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" required>
    </div>

    <div class="input-box">
      <label for="password">Password</label>

      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Enter password" required>
        <button type="button" class="toggle-password" onclick="togglePassword(this)">Show</button>
      </div>
    </div>

    <button type="submit" class="login-btn">Login</button>
  </form>

  <div class="extra-links">
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

<script>
// Toggle password (fixed)
function togglePassword(btn) {
  const input = document.getElementById("password");

  if (input.type === "password") {
    input.type = "text";
    btn.innerText = "Hide";
  } else {
    input.type = "password";
    btn.innerText = "Show";
  }
}
</script>

</body>
</html>
