<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Meter-Sathi</title>
  <meta name="viewport" content="width=1400">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="margin-bottom: 30px;">
        <a href="welcome.html" class="nav-back" style="display:inline-flex; width:auto;">
          <i class="fa-solid fa-arrow-left"></i> Back
        </a>
      </div>

      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Login to your account to verify your rides.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope" style="margin-right:6px; color:var(--taxi-yellow);"></i>Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock" style="margin-right:6px; color:var(--taxi-yellow);"></i>Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter password" required>
            <button type="button" class="toggle-btn" onclick="togglePassword(this)"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <button type="submit" class="auth-btn-submit">Login <i class="fa-solid fa-arrow-right" style="margin-left:8px;"></i></button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(btn) {
      const input = document.getElementById("password");
      if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        input.type = "password";
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
    }
  </script>
</body>
</html>
