<!DOCTYPE html>
<html>
<head>
  <title>Meter-Sathi Ride Auditor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #f9f9f9; color: #333; }
    /* Navbar */
    .navbar {
      display: flex;
      justify-content: center;
      background-color: #ff6f91;
      padding: 10px 0;
    }
    .nav-links { display: flex; justify-content: center; }
    .nav-links a {
      margin: 0 10px; padding: 8px 12px; border-radius: 5px;
      text-decoration: none; color: #fff; font-weight: bold;
    }
    .nav-links a:nth-child(1) { background-color: #f9a825; }
    .nav-links a:nth-child(2) { background-color: #00bcd4; }
    .nav-links a:nth-child(3) { background-color: #ff7043; }
    .nav-links a:nth-child(4) { background-color: #009688; }
    .nav-links a:nth-child(5) { background-color: #8e24aa; }

    /* Main content */
    .container { text-align: center; padding: 40px; }
    .brand-title {
      font-size: 48px; font-weight: bold; color: #2c3e50; margin-bottom: 10px;
    }
    .brand-subtitle {
      font-size: 24px; color: #555; margin-bottom: 30px;
    }
    button {
      margin: 10px; padding: 12px 20px; border: none; border-radius: 5px;
      cursor: pointer; font-size: 16px; color: #fff; transition: background-color 0.3s ease;
    }
    button.start { background-color: #2196f3; }
    button.start:hover { background-color: #1976d2; }
    button.end { background-color: #6a1b9a; }
    button.end:hover { background-color: #4a148c; }
    button.check { background-color: #ff5722; }
    button.check:hover { background-color: #e64a19; }
    input {
      padding: 10px; margin: 10px; border: 1px solid #ccc; border-radius: 5px; width: 200px;
    }
    .results { margin-top: 20px; font-weight: bold; }
    .alert { color: red; font-weight: bold; }

    /* Footer */
    footer {
      background-color: #ff9800; color: #fff; text-align: center; padding: 15px; margin-top: 40px;
    }
    footer a { color: #fff; margin: 0 10px; text-decoration: none; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="brand-title">Meter-Sathi</div>
    <div class="brand-subtitle">Auto/Taxi Fare Auditor</div>

    <button class="start" onclick="startRide()">Start Ride</button>
    <button class="end" onclick="endRide()">End Ride</button>
    
    <p id="distance">Distance: 0 km</p>

    <label for="meter">Meter Reading (₹):</label>
    <input type="number" id="meter" placeholder="Enter meter fare">
    <button class="check" onclick="compareFare()">Check Fare</button>

    <div class="results">
      <p id="official">Official Fare: ₹26</p>
      <p id="meterFare">Meter Fare: ₹0</p>
      <p id="difference">Difference: ₹0</p>
      <p id="alert" class="alert"></p>
    </div>

    <p style="color:#009688;">Based on MMRTA Official Tariff 2025</p>
  </div>

  <!-- Footer -->
  <footer>
    <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
    <p>© 2024 Meter-Sathi</p>
  </footer>

  <!-- Script -->
  <script>
    let watchId;
    let startCoords = null;
    let totalDistance = 0;

    function startRide() {
      totalDistance = 0;
      navigator.geolocation.getCurrentPosition(function(pos) {
        startCoords = pos.coords;
      });
      watchId = navigator.geolocation.watchPosition(trackRide, null, { enableHighAccuracy: true });
    }

    function trackRide(position) {
      if (startCoords) {
        const lat1 = startCoords.latitude;
        const lon1 = startCoords.longitude;
        const lat2 = position.coords.latitude;
        const lon2 = position.coords.longitude;
        
        const dist = getDistance(lat1, lon1, lat2, lon2);
        totalDistance += dist;
        startCoords = position.coords;
        
        document.getElementById("distance").innerText = "Distance: " + totalDistance.toFixed(2) + " km";
      }
    }

    function endRide() {
      navigator.geolocation.clearWatch(watchId);
      alert("Ride ended. Total Distance: " + totalDistance.toFixed(2) + " km");
    }

    // Haversine formula
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Fare calculation (example tariff)
    function calculateOfficialFare(distanceKm) {
      let fare = 26; // base fare for first 1.5 km
      if (distanceKm > 1.5) {
        fare += (distanceKm - 1.5) * 17.14; // ₹17.14 per km after 1.5 km
      }
      // Night surcharge (12 AM - 5 AM)
      const hour = new Date().getHours();
      if (hour >= 0 && hour < 5) {
        fare *= 1.25;
      }
      return Math.round(fare);
    }

    function compareFare() {
      const meterValue = parseFloat(document.getElementById("meter").value) || 0;
      const officialFare = calculateOfficialFare(totalDistance);
      const difference = meterValue - officialFare;

      document.getElementById("official").innerText = "Official Fare: ₹" + officialFare;
      document.getElementById("meterFare").innerText = "Meter Fare: ₹" + meterValue;
      document.getElementById("difference").innerText = "Difference: ₹" + difference;

      if (difference > 0) {
        document.getElementById("alert").innerText = "You are being overcharged by ₹" + difference;
      } else if (difference < 0) {
        document.getElementById("alert").innerText = "Meter shows less than official fare!";
      } else if (difference = null) {
        document.getElementById("alert").innerText="enter fair";
      } else {
        document.getElementById("alert").innerText = "Fair Fare!";
      }
    }

    // ✅ New feature: trigger fare check on Enter key
    document.getElementById("meter").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        compareFare();
      }
    });
  </script>
</body>
</html>
