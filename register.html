<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Meter-Sathi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.css"/>

<style>
:root{
  --bg:#000;
  --gold:#FFD700;
  --card:#1A1A1A;
  --muted:#ddd;
  --border:#333;
  --error:#ff4d4d;
}

body{
  background:var(--bg);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Segoe UI',sans-serif;
  margin: 0;
}

.register-container{
  background:var(--card);
  padding:30px;
  border-radius:12px;
  width:340px;
  box-shadow: 0 8px 25px rgba(255, 215, 0, 0.1);
  border: 1px solid var(--border);
}

/* --- NEW: Stylish Back Button Styles --- */
.back-btn-container {
  margin-bottom: 20px;
  text-align: left;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 16px 6px 6px; 
  border: 1px solid var(--border);
  border-radius: 30px;
  background: #000; 
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.back-btn .arrow-circle {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #222;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  font-size: 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.back-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
  transform: translateX(-5px);
  box-shadow: 0 4px 12px rgba(255, 215, 0, 0.15);
}

.back-btn:hover .arrow-circle {
  background: var(--gold);
  color: #000;
}
/* --- End Back Button Styles --- */

h2{
  text-align:center;
  color:var(--gold);
  margin-top: 0;
  margin-bottom: 20px;
}

.input-box{
  margin-bottom:15px;
}

.input-box label{
  color:var(--muted);
  font-size:14px;
}

.input-box input{
  width:100%;
  padding:10px;
  margin-top:5px;
  background:#000;
  border:1px solid var(--border);
  color:#fff;
  border-radius: 6px;
  box-sizing: border-box;
  outline: none;
  transition: border-color 0.3s;
}

.input-box input:focus {
  border-color: var(--gold);
}

.name-row{
  display:flex;
  gap:10px;
}

.name-row .input-box{
  flex:1;
}

.password-box{
  position:relative;
}

.toggle-password{
  position:absolute;
  right:10px;
  top:36px;
  background:none;
  border:none;
  color:var(--gold);
  cursor:pointer;
  font-size:12px;
  font-weight: bold;
}

.error{
  color:var(--error);
  font-size:12px;
  margin-top:5px;
  display:none;
}

.register-btn{
  width:100%;
  padding:12px;
  background:var(--gold);
  color: #000;
  border:none;
  border-radius: 6px;
  font-weight:bold;
  cursor:pointer;
  font-size: 15px;
  margin-top: 10px;
  transition: background 0.3s, transform 0.2s;
}

.register-btn:hover {
  background: #e6c300;
  transform: translateY(-2px);
}
</style>
</head>

<body>

<div class="register-container">
  
  <div class="back-btn-container">
    <a href="login.html" class="back-btn">
      <span class="arrow-circle">&larr;</span> Back
    </a>
  </div>

  <h2>Register</h2>

  <form id="registerForm">

    <div class="name-row">
      <div class="input-box">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="First name" required>
      </div>

      <div class="input-box">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Last name" required>
      </div>
    </div>

    <div class="input-box">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email" required>
    </div>

    <div class="input-box password-box">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
      <button type="button" class="toggle-password" onclick="togglePassword('password', this)">Show</button>
    </div>

    <div class="input-box password-box">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm password" required>
      <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">Show</button>
      <div class="error" id="passError">Passwords do not match</div>
    </div>

    <div class="input-box">
      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" placeholder="10-digit number" required maxlength="10">
      <div class="error" id="phoneError">Enter valid 10-digit number</div>
    </div>

    <button type="submit" class="register-btn">Register</button>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>

<script>
// Phone input setup
const phoneInput = document.querySelector("#phone");

window.intlTelInput(phoneInput, {
  initialCountry: "in",
  separateDialCode: true,
  preferredCountries: ["in", "us", "gb"]
});

// Allow only numbers
phoneInput.addEventListener("input", function () {
  this.value = this.value.replace(/[^0-9]/g, "");
});

// Toggle password
function togglePassword(id, btn) {
  const input = document.getElementById(id);

  if (input.type === "password") {
    input.type = "text";
    btn.innerText = "Hide";
  } else {
    input.type = "password";
    btn.innerText = "Show";
  }
}

// Validation
const form = document.getElementById("registerForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const passError = document.getElementById("passError");
const phoneError = document.getElementById("phoneError");

form.addEventListener("submit", function(e) {

  let valid = true;

  // Password match check
  if (password.value !== confirmPassword.value) {
    passError.style.display = "block";
    valid = false;
  } else {
    passError.style.display = "none";
  }

  // Phone validation
  if (phoneInput.value.length !== 10) {
    phoneError.style.display = "block";
    valid = false;
  } else {
    phoneError.style.display = "none";
  }

  if (!valid) e.preventDefault();
});
</script>

</body>
</html>
