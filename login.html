<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Meter-Sathi</title>
  <meta name="viewport" content="width=1400">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="margin-bottom: 30px;">
        <a href="welcome.html" class="nav-back" style="display:inline-flex; width:auto;">
          <i class="fa-solid fa-arrow-left"></i> Back
        </a>
      </div>

      <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Login to your account to verify your rides.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope" style="margin-right:6px; color:var(--taxi-yellow);"></i>Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock" style="margin-right:6px; color:var(--taxi-yellow);"></i>Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Enter password" required>
            <button type="button" class="toggle-btn" onclick="togglePassword(this)"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <button type="submit" class="auth-btn-submit">Login <i class="fa-solid fa-arrow-right" style="margin-left:8px;"></i></button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyArV1sP0G8-6NwRUclY3uChof3b9TfmGB0",
      authDomain: "meter-sathi.firebaseapp.com",
      projectId: "meter-sathi",
      storageBucket: "meter-sathi.firebasestorage.app",
      messagingSenderId: "762038628393",
      appId: "1:762038628393:web:6a03c56a9b945fe36aac38"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.togglePassword = function(btn) {
      const input = document.getElementById("password");
      if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        input.type = "password";
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
    };

    const loginForm = document.getElementById("loginForm");
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const submitBtn = document.querySelector(".auth-btn-submit");

      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = "Logging in...";
      submitBtn.disabled = true;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        window.location.href = "welcome.html";

      } catch (error) {
        console.error("Login Error:", error.code, error.message);
        
        let errorMsg = "Login failed. Please check your credentials.";
        if (error.code === 'auth/invalid-credential') {
          errorMsg = "Invalid email or password.";
        } else if (error.code === 'auth/user-not-found') {
          errorMsg = "No account found with this email.";
        }

        alert(errorMsg);
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
