<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Meter-Sathi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#000;
  --gold:#FFD700;
  --gold-strong:#ffcc00;
  --card:#1A1A1A;
  --muted:#dddddd;
  --border:#333;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-container{
  background:var(--card);
  padding:30px;
  border-radius:12px;
  width:320px;
  box-shadow:0 0 20px rgba(255, 215, 0, 0.2);
  border:1px solid var(--border);
}

.login-container h2{
  text-align:center;
  color:var(--gold);
  margin-bottom:20px;
}

.input-box{
  margin-bottom:15px;
}

.input-box label{
  font-size:14px;
  color:var(--muted);
}

.input-box input{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:1px solid var(--border);
  border-radius:6px;
  background:#000;
  color:#fff;
}

.input-box input:focus{
  border-color:var(--gold);
  box-shadow:0 0 5px var(--gold);
}

.password-wrapper{
  position:relative;
}

.password-wrapper input{
  padding-right:60px;
}

.toggle-password{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--gold);
  font-size:13px;
  cursor:pointer;
  font-weight:bold;
}

.login-btn{
  width:100%;
  padding:10px;
  background:var(--gold);
  border:none;
  color:#000;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.login-btn:hover{
  background:var(--gold-strong);
}

.extra-links{
  margin-top:15px;
  font-size:14px;
  text-align:center;
}

.extra-links a{
  color:var(--gold);
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-container">
  <h2>Login</h2>

  <form id="loginForm">
    
    <div class="input-box">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>

    <div class="input-box">
      <label for="password">Password</label>

      <div class="password-wrapper">
        <input type="password" id="password" required>
        <button type="button" class="toggle-password">
          Show
        </button>
      </div>
    </div>

    <button type="submit" class="login-btn">Login</button>
  </form>

  <div class="extra-links">
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

<script>
function togglePassword() {
  const passwordInput = document.getElementById("password");
  const eyeIcon = document.getElementById("eyeIcon");

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    eyeIcon.innerHTML = `
      <path d="M17.94 17.94C16.12 19.24 14.13 20 12 20C5 20 1 12 1 12C2.24 9.77 3.82 7.82 5.7 6.34M9.9 4.24C10.6 4.08 11.3 4 12 4C19 4 23 12 23 12C22.1 13.7 20.9 15.2 19.5 16.5M1 1L23 23" stroke="#FFC400" stroke-width="2"/>
    `;
  } else {
    passwordInput.type = "password";
    eyeIcon.innerHTML = `
      <path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="#FFC400" stroke-width="2"/>
      <circle cx="12" cy="12" r="3" stroke="#FFC400" stroke-width="2"/>
    `;
  }
}
</script>

</body>
</html>
